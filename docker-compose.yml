# Run the WHOLE app (database + API + UI) with one command:
#     docker compose up -d --build
# Then open http://localhost  (or http://<server-ip> on AWS).
# To use Neon (or any external Postgres) instead of the bundled database, put DATABASE_URL in a .env file next to this file.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nfpl
      POSTGRES_PASSWORD: nfpl
      POSTGRES_DB: nfpl
    ports: ["127.0.0.1:5432:5432"]          # local access only (never exposed to the internet)
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nfpl -d nfpl"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://nfpl:nfpl@db:5432/nfpl}
      PORT: "3000"
      AUTO_SEED: ${AUTO_SEED:-true}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s                      # migrations + seeding run before the server starts
    restart: unless-stopped                  # the API is NOT published to the host; only nginx is

  web:
    build: ./frontend
    ports: ["${WEB_PORT:-80}:80"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:

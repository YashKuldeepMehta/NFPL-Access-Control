server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # /api/... -> backend container (the trailing slash strips the /api prefix, like the Vite dev proxy)
  location /api/ {
    proxy_pass http://backend:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location / {
    try_files $uri /index.html;   # React single-page app
  }
}
